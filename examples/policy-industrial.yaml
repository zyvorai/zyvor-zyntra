#
# Two-person approval for the industrial packs. High-risk proposals (load
# shifts, patching, firewall changes, stand-downs) need three people, one of
# whom is not the proposer, on input that is not stale. Approvals are
# time-boxed. Changes to a running plant are best made in a window, so the
# example defines one: weekdays 22:00-24:00 UTC. Edit it to match your stops.
maintenanceWindows:
  plant-stop:
    days: [mon, tue, wed, thu, fri]
    start: "22:00"
    end: "24:00"
    timezone: UTC

rules:
  - name: baseline-two-person
    approvals: 2
    distinctFromProposer: true
    requireFresh: true
    pendingExpiry: 24h
    approvedExpiry: 4h

  - name: high-risk-three-person
    match: { risk: [high] }
    approvals: 3
    distinctFromProposer: true
    requireFresh: true
    approvedExpiry: 2h

revalidation:
  maxDrift: 0.2

users: []
