#
# Starting policy for the defence packs (zyntra serve -policy
# examples/policy-defence.yaml). Every proposal needs a second person, the
# proposer can never approve their own, and high-risk actions need three
# approvals. Stale inputs block approval. Add your own users and windows.

maintenanceWindows:
  standdown:
    days: [sat, sun]
    start: "00:00"
    end: "24:00"
    timezone: UTC

rules:
  - name: baseline-two-person
    approvals: 2
    distinctFromProposer: true
    requireFresh: true
    pendingExpiry: 24h
    approvedExpiry: 4h

  - name: high-risk-three-person
    match: { risk: [high] }
    approvals: 3
    distinctFromProposer: true
    requireFresh: true
    approvedExpiry: 2h

revalidation:
  maxDrift: 0.3

users: []
