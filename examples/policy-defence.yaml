#
# Starting policy for the defence packs (zyntra serve -policy
# examples/policy-defence.yaml). Every proposal needs a second person, the
# proposer can never approve their own, and high-risk actions need three
# approvals. Stale inputs block approval. Add your own users and windows.

maintenanceWindows:
  standdown:
    days: [sat, sun]
    start: "00:00"
    end: "24:00"
    timezone: UTC

# Data markings, least restricted first. Mark a KPI, action, ontology type or
# property with `marking: cui`; an account sees it only with `clearance: cui`
# or higher (users below, or ZYNTRA_OIDC_CLEARANCE_MAP for OIDC). Anything
# above a caller's clearance is removed from every response, administrators
# included. Marking nothing changes nothing.
markings:
  levels: [unclassified, cui, cui-specified]

rules:
  - name: baseline-two-person
    approvals: 2
    distinctFromProposer: true
    requireFresh: true
    pendingExpiry: 24h
    approvedExpiry: 4h

  - name: high-risk-three-person
    match: { risk: [high] }
    approvals: 3
    distinctFromProposer: true
    requireFresh: true
    approvedExpiry: 2h

revalidation:
  maxDrift: 0.3

users: []
# Example accounts (generate hashes with: zyntra hash-password < password.txt):
#  - {name: ana, passwordHash: "$2a$12$...", roles: [viewer], clearance: cui}
