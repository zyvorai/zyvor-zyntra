#
# Replace the fixture files with exports from your incident and maintenance systems (same columns). Dry-run never needs
# any variable.
variables: []
files:
  - {path: fixture/events.csv, description: "Process-safety events: event_id, tier (1|2)"}
  - {path: fixture/moc.csv, description: "Management-of-change items: moc_id, state (open|closed), overdue_days"}
  - {path: fixture/prooftests.csv, description: "Safety devices: device_id, class (sis|relief|alarm), due_in_days (negative means overdue)"}
  - {path: fixture/demands.csv, description: "Safety-system demands: demand_id, system (sis|relief|esd)"}
